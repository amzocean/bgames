<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGames - Home</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="home-wrap">
    <header class="home-hero">
      <div class="home-controls">
        <button class="sound-toggle" data-sound-toggle type="button">Sound: On 🔊</button>
      </div>
      <h1>BGames</h1>
      <p>Choose a mode and jump into playtime.</p>
    </header>

    <section class="home-mode-grid">
      <a class="mode-tile solo" href="/solo/">
        <span class="emoji">🎯</span>
        <h2>Play Solo</h2>
        <p>Fun games for one player.</p>
      </a>
      <a class="mode-tile papa" href="/papa/">
        <span class="emoji">👨‍👦</span>
        <h2>Play with Papa</h2>
        <p>Play together during your call.</p>
      </a>
    </section>
  </main>
  <script src="/sound.js"></script>
</body>
</html>
