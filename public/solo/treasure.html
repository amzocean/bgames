<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGames - Treasure Map</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="game-wrap">
    <div class="topbar">
      <a href="/solo/">Back to Solo</a>
      <strong>Treasure Map</strong>
      <button class="sound-toggle" data-sound-toggle type="button">Sound: On 🔊</button>
    </div>
    <section class="play-area">
      <div class="hud">
        <span class="pill">Step: <span id="step">0</span></span>
        <span class="pill">Wins: <span id="wins">0</span></span>
        <span class="pill target" id="goalPill">Goal: Follow clues</span>
      </div>
      <p id="prompt">Follow the landmarks in order to find treasure.</p>
      <p class="helper clue-focus" id="feedback" aria-live="polite">Tap START to begin.</p>
      <div class="mini-tools">
        <button id="hearClue" class="secondary">Hear Clue</button>
      </div>
      <div id="board" class="board"></div>
      <button id="newRound">New Map</button>
    </section>
  </main>
  <script src="/sound.js"></script>
  <script src="/solo/treasure.js"></script>
</body>
</html>
