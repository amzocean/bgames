<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGames - Build the Scene</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="game-wrap">
    <div class="topbar">
      <a href="/solo/">Back to Solo</a>
      <strong>Build the Scene</strong>
      <button class="sound-toggle" data-sound-toggle type="button">Sound: On 🔊</button>
    </div>
    <section class="play-area">
      <div class="hud">
        <span class="pill">Placed: <span id="placed">0</span></span>
        <span class="pill">Wins: <span id="wins">0</span></span>
        <span class="pill target" id="scenePill">Scene: -</span>
      </div>
      <p id="prompt" data-clue-source>Pick an item, then tap where it belongs.</p>
      <p class="helper" id="feedback">Tap a piece from the tray to start.</p>

      <div id="zones" class="board scene-zone-grid"></div>
      <div id="tray" class="board scene-tray"></div>

      <button id="newRound">New Scene</button>
    </section>
  </main>
  <script src="/sound.js"></script>
  <script src="/solo/scene.js"></script>
</body>
</html>
