<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGames - Detective Find-It</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="game-wrap">
    <div class="topbar">
      <a href="/solo/">Back to Solo</a>
      <strong>Detective Find-It</strong>
      <button class="sound-toggle" data-sound-toggle type="button">Sound: On 🔊</button>
    </div>
    <section class="play-area">
      <div id="celebration" class="detective-celebration" aria-live="polite">
        <div class="celebration-message">🎉 Super Star! 🎉</div>
        <div class="burst" aria-hidden="true">
          <span>✨</span><span>🌟</span><span>🎊</span><span>⭐</span><span>💫</span><span>🎉</span>
        </div>
      </div>
      <div class="hud">
        <span class="pill target" id="targetPill">Target: -</span>
        <span class="pill">Remaining: <span id="remaining">0</span></span>
        <span class="pill">Score: <span id="score">0</span></span>
      </div>
      <p id="prompt"></p>
      <p class="helper" id="feedback">Warm-up round.</p>
      <div id="board" class="board"></div>
      <button id="newRound">New Round</button>
    </section>
  </main>
  <script src="/sound.js"></script>
  <script src="/solo/detective.js"></script>
</body>
</html>
