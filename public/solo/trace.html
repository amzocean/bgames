<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGames - Trace and Dots</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="game-wrap">
    <div class="topbar">
      <a href="/solo/">Back to Solo</a>
      <strong>Trace/Connect-the-Dots</strong>
      <button class="sound-toggle" data-sound-toggle type="button">Sound: On 🔊</button>
    </div>
    <section class="play-area">
      <div class="hud">
        <span class="pill">Progress: <span id="progress">0/0</span></span>
      </div>
      <p id="prompt">Tap the dots in number order.</p>
      <p class="helper" id="feedback">Warm-up round.</p>
      <div class="canvas-box">
        <canvas id="canvas" width="820" height="420"></canvas>
      </div>
      <div class="row actions">
        <button id="reset">New Pattern</button>
      </div>
    </section>
  </main>
  <script src="/sound.js"></script>
  <script src="/solo/trace.js"></script>
</body>
</html>
