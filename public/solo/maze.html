<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGames - Hidden Path Maze</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="game-wrap">
    <div class="topbar">
      <a href="/solo/">Back to Solo</a>
      <strong>Hidden Path / Maze</strong>
      <button class="sound-toggle" data-sound-toggle type="button">Sound: On 🔊</button>
    </div>
    <section class="play-area">
      <div class="hud">
        <span class="pill">Progress: <span id="progress">0</span></span>
        <span class="pill">Wins: <span id="wins">0</span></span>
        <span class="pill target" id="goalPill">Goal: Reach treasure</span>
      </div>
      <p id="prompt">Follow the path from START to TREASURE.</p>
      <p class="helper" id="feedback">Watch the path, then tap it.</p>
      <div id="board" class="board"></div>
      <button id="newRound">New Maze</button>
    </section>
  </main>
  <script src="/sound.js"></script>
  <script src="/solo/maze.js"></script>
</body>
</html>
