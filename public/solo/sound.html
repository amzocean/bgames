<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGames - Sound Hunt</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="game-wrap">
    <div class="topbar">
      <a href="/solo/">Back to Solo</a>
      <strong>Sound Hunt</strong>
      <button class="sound-toggle" data-sound-toggle type="button">Sound: On 🔊</button>
    </div>
    <section class="play-area">
      <div class="hud">
        <span class="pill">Score: <span id="score">0</span></span>
        <span class="pill">Streak: <span id="streak">0</span></span>
        <span class="pill target" id="targetPill">Clue: -</span>
      </div>
      <p id="prompt" data-clue-source>Listen to the clue, then tap the matching picture.</p>
      <p class="helper" id="feedback">Tap Hear Clue to start.</p>
      <div class="mini-tools">
        <button id="hearClue" class="secondary">Hear Clue</button>
      </div>
      <div id="board" class="board"></div>
      <button id="newRound">New Round</button>
    </section>
  </main>
  <script src="/sound.js"></script>
  <script src="/solo/sound.js"></script>
</body>
</html>
