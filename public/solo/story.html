<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGames - Story Match</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="game-wrap">
    <div class="topbar">
      <a href="/solo/">Back to Solo</a>
      <strong>Story Match</strong>
      <button class="sound-toggle" data-sound-toggle type="button">Sound: On 🔊</button>
    </div>
    <section class="play-area">
      <div class="hud">
        <span class="pill">Matches: <span id="matches">0</span></span>
        <span class="pill">Streak: <span id="streak">0</span></span>
        <span class="pill target" id="pairsPill">Pairs: 0</span>
      </div>
      <p id="prompt">Match cards that belong to the same mini-story.</p>
      <p class="helper" id="feedback">Tap one card, then its matching partner.</p>
      <div id="board" class="board"></div>
      <button id="newRound">New Story Set</button>
    </section>
  </main>
  <script src="/sound.js"></script>
  <script src="/solo/story.js"></script>
</body>
</html>
